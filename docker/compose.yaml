# Local stack: the published image plus a Redis. Run from this directory:
#   cp ../.env.docker.example ../.env.docker   # then adjust as needed
#   docker compose up
services:
  service-media_stream:
    container_name: service-media_stream
    restart: "no"
    # Pin a specific release for reproducibility with MEDIA_STREAM_IMAGE_TAG=v2.60.7.
    image: gro0ve/grooveshop-media-stream:${MEDIA_STREAM_IMAGE_TAG:-latest}
    env_file:
      - ../.env.docker
    ports:
      - "3003:3003"
    depends_on:
      - redis
    networks:
      - groovy-backbone

  redis:
    container_name: redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    networks:
      - groovy-backbone

networks:
  groovy-backbone:
    driver: bridge
