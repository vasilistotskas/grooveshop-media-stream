<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrooveShop Media Stream API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e4e4e7;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 30px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 16px;
        }

        .endpoint {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: inherit;
            text-decoration: none;
            transition: background 0.15s ease;
        }

        .endpoint:hover {
            background: rgba(0, 212, 255, 0.08);
        }

        .method {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }

        .endpoint-path {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .endpoint-note {
            margin-left: auto;
            color: #94a3b8;
            font-size: 0.85em;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9em;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 2em;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">GrooveShop Media Stream</div>
            <div class="subtitle">Image processing and streaming service</div>
        </div>

        <div class="card">
            <div class="card-title">Endpoints</div>
            <a class="endpoint" href="/health">
                <span class="method">GET</span>
                <span class="endpoint-path">/health</span>
                <span class="endpoint-note">full health report</span>
            </a>
            <a class="endpoint" href="/health/live">
                <span class="method">GET</span>
                <span class="endpoint-path">/health/live</span>
                <span class="endpoint-note">liveness</span>
            </a>
            <a class="endpoint" href="/health/ready">
                <span class="method">GET</span>
                <span class="endpoint-path">/health/ready</span>
                <span class="endpoint-note">readiness</span>
            </a>
            <div class="endpoint">
                <span class="method">GET</span>
                <span class="endpoint-path">/media_stream-image/…</span>
                <span class="endpoint-note">image routes</span>
            </div>
        </div>

        <div class="footer">
            Built for <a href="https://github.com/vasilistotskas/grooveshop-media-stream" target="_blank" rel="noopener">GrooveShop</a>
        </div>
    </div>
</body>
</html>
