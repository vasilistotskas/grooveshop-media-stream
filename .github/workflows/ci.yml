name: CI

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Node line as docker/Dockerfile's NODE_VERSION
  NODE_VERSION: 24.19.0

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        # SHA-pinned: trivy-action's mutable tags were hijacked in the
        # 2026-03 supply-chain incident, so tags are not trusted.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          skip-dirs: node_modules,dist,build
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  ci:
    name: Quality, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint:ci

      - name: Check TypeScript
        run: pnpm run type-check

      - name: Build application
        run: pnpm run build

      - name: Run unit tests with coverage
        run: pnpm run test:coverage
        timeout-minutes: 10

      - name: Run E2E tests
        run: pnpm run test:e2e
        timeout-minutes: 15

      - name: Test production build
        env:
          NODE_ENV: production
          CORS_ORIGIN: https://store.example.com
          BACKEND_URL: http://backend-service:8000
          # The CI Redis service has no password; this only satisfies the
          # production-mode guard in RedisCacheService (ioredis warns and continues).
          REDIS_PASSWORD: ci_smoke_test_password
        run: |
          timeout 10s pnpm run prod || exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "Production build starts successfully"
          else
            echo "Production build failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const s = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              console.log('| Metric | Coverage | Covered / Total |');
              console.log('|--------|----------|-----------------|');
              console.log(\`| Statements | \${s.statements.pct}% | \${s.statements.covered} / \${s.statements.total} |\`);
              console.log(\`| Branches   | \${s.branches.pct}% | \${s.branches.covered} / \${s.branches.total} |\`);
              console.log(\`| Functions  | \${s.functions.pct}% | \${s.functions.covered} / \${s.functions.total} |\`);
              console.log(\`| Lines      | \${s.lines.pct}% | \${s.lines.covered} / \${s.lines.total} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  release:
    name: Release
    needs: [ci, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.MEDIA_STREAM_GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No release assets: the deployable is the Docker image built by
      # docker.yml on the published release. Uploading build/dist as
      # per-file GitHub release assets cost ~6.5 min per release and
      # nothing consumed them.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.MEDIA_STREAM_GITHUB_TOKEN }}
        run: pnpm run semantic-release
