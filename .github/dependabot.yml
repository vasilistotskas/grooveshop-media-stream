version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7 (the Go-native compiler) ships no JS API, and
      # typescript-eslint refuses it outright ("typescript-eslint does
      # not support TS 7.0", PR #22's CI). Remove this once TS 7.1 has
      # its API and typescript-eslint supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    open-pull-requests-limit: 10

  # Version updates only (security updates are neither grouped nor
  # delayed by these settings): minor and patch action bumps arrive
  # together, a major arrives on its own to be checked against these
  # workflows, and a release ages a week before it is proposed. "ci"
  # cuts no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
