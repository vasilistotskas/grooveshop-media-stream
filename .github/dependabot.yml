version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7 (the Go-native compiler) ships no JS API, and
      # typescript-eslint refuses it outright ("typescript-eslint does
      # not support TS 7.0", PR #22's CI). Remove this once TS 7.1 has
      # its API and typescript-eslint supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
