allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
overrides:
  lodash: '>=4.18.1'
  # CVE-2026-9697, CVE-2026-6734, CVE-2026-12151 (HIGH) — undici
  # 7.x line patched in 7.28.0. Capped at <8 so the 7.x consumers
  # (@semantic-release/github) stay on the major they declare: an
  # unbounded floor would hand them undici 8, whose handler API differs.
  # jsdom (30) depends on undici 8 itself, outside this selector. The
  # 6.x copy (@actions/http-client) is left untouched.
  'undici@>=7.0.0 <7.28.0': '>=7.28.0 <8'
  # CVE-2026-5079 (HIGH) — multer DoS, patched in 2.2.0.
  'multer@<2.2.0': '>=2.2.0'
  # CVE-2026-12143 (HIGH) — form-data, patched in 4.0.6.
  'form-data@<4.0.6': '>=4.0.6'
